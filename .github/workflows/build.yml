name: Build desktop packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            os: darwin
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: windows-2025
            os: windows
            arch: amd64
          - runner: windows-11-arm
            os: windows
            arch: arm64
    timeout-minutes: 30
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Linux GUI dependencies
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev
      - name: Windows C compiler
        id: msys2
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: ${{ matrix.arch == 'arm64' && 'CLANGARM64' || 'UCRT64' }}
          install: ${{ matrix.arch == 'arm64' && 'mingw-w64-clang-aarch64-clang' || 'mingw-w64-ucrt-x86_64-gcc' }}
          path-type: inherit
      - name: Windows compiler path
        if: matrix.os == 'windows'
        shell: bash
        run: |
          toolchain_root=$(cygpath -m '${{ steps.msys2.outputs.msys2-location }}')
          if [ '${{ matrix.arch }}' = arm64 ]; then
            toolchain_bin="$toolchain_root/clangarm64/bin"
            echo "CC=$toolchain_bin/clang.exe" >> "$GITHUB_ENV"
            echo 'CGO_CFLAGS=-DWINBOOL=BOOL' >> "$GITHUB_ENV"
          else
            toolchain_bin="$toolchain_root/ucrt64/bin"
            echo "CC=$toolchain_bin/gcc.exe" >> "$GITHUB_ENV"
          fi
          echo "$toolchain_bin" >> "$GITHUB_PATH"
          test -f "$toolchain_bin/${{ matrix.arch == 'arm64' && 'clang' || 'gcc' }}.exe"
          "$toolchain_bin/${{ matrix.arch == 'arm64' && 'clang' || 'gcc' }}.exe" --version
      - name: Dependency integrity and static checks
        shell: bash
        run: |
          go mod verify
          go vet ./...
      - name: Known dependency vulnerabilities
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build and package
        shell: bash
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: ./scripts/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcp-connect-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1
