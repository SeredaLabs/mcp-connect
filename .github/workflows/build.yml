name: Build desktop packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            os: darwin
            arch: arm64
            previous-sha256: 63f9e2ac35a3795f756b635084d1f3cecca5dbb48bc8739537cf1883c676b75e
          - runner: macos-15-intel
            os: darwin
            arch: amd64
            previous-sha256: dd47cb4e0052c578fb46820570ac15abf63200a1df685115b4e67079c77187b0
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
            previous-sha256: e9fcddf1175dbb275911bcedb15c6bdb27313eb4e6b8e0bb08291d413d168e1d
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            previous-sha256: 0339f56ce556533ee972ddd1344d831b8e05c060c306bf8f412f05ac18e80184
          - runner: windows-2025
            os: windows
            arch: amd64
            previous-sha256: 14782c73eff41c3f1b8c0745f9a5345d4d8aba9dbfe4de4dd62b5deecb4bd9ba
          - runner: windows-11-arm
            os: windows
            arch: arm64
            previous-sha256: 6423b5f7c9efb1a60e49c230cf7b78fcd35a6b2b0fa0e7a7b6296c890a63bd7d
    timeout-minutes: 30
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Linux GUI dependencies
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev libgl1-mesa-dri xvfb xauth xdotool
      - name: Windows C compiler
        id: msys2
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: ${{ matrix.arch == 'arm64' && 'CLANGARM64' || 'UCRT64' }}
          install: ${{ matrix.arch == 'arm64' && 'mingw-w64-clang-aarch64-clang' || 'mingw-w64-ucrt-x86_64-gcc' }}
          path-type: inherit
      - name: Windows compiler path
        if: matrix.os == 'windows'
        shell: bash
        run: |
          toolchain_root=$(cygpath -m '${{ steps.msys2.outputs.msys2-location }}')
          if [ '${{ matrix.arch }}' = arm64 ]; then
            toolchain_bin="$toolchain_root/clangarm64/bin"
            echo "CC=$toolchain_bin/clang.exe" >> "$GITHUB_ENV"
            echo 'CGO_CFLAGS=-DWINBOOL=BOOL' >> "$GITHUB_ENV"
          else
            toolchain_bin="$toolchain_root/ucrt64/bin"
            echo "CC=$toolchain_bin/gcc.exe" >> "$GITHUB_ENV"
          fi
          echo "$toolchain_bin" >> "$GITHUB_PATH"
          test -f "$toolchain_bin/${{ matrix.arch == 'arm64' && 'clang' || 'gcc' }}.exe"
          "$toolchain_bin/${{ matrix.arch == 'arm64' && 'clang' || 'gcc' }}.exe" --version
      - name: Dependency integrity and static checks
        shell: bash
        run: |
          go mod verify
          go vet ./...
      - name: Unit and adapter contract tests
        shell: bash
        run: go test ./... -count=1
      - name: Race detector
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        shell: bash
        run: go test -race ./... -count=1
      - name: Known dependency vulnerabilities
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Windows installer compiler
        if: matrix.os == 'windows'
        shell: pwsh
        run: ./scripts/setup-inno.ps1
      - name: Build and package
        shell: bash
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          ./scripts/build.sh
          ./scripts/package-installer.sh
      - name: Compile native macOS window probe
        if: matrix.os == 'darwin'
        shell: bash
        run: swiftc scripts/gui-window.swift -o "$RUNNER_TEMP/gui-window"
      - name: Observe native GUI window
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set +e
          if [ '${{ matrix.os }}' = linux ]; then
            xvfb-run -a python3 scripts/gui-smoke.py --platform '${{ matrix.os }}' --arch '${{ matrix.arch }}' --output "$RUNNER_TEMP/gui-check"
          else
            python scripts/gui-smoke.py --platform '${{ matrix.os }}' --arch '${{ matrix.arch }}' --output "$RUNNER_TEMP/gui-check"
          fi
          result=$?
          if [ "$result" = 77 ]; then
            echo '::warning::Native GUI environment unavailable or unconfirmed. This is not a passing GUI check; see the GUI report.'
            exit 0
          fi
          exit "$result"
      - name: Save GUI diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gui-check-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/gui-check/
          if-no-files-found: ignore
          retention-days: 7
      - name: Prepare existing installation for upgrade (macOS/Linux)
        if: matrix.os != 'windows'
        shell: bash
        run: |
          if [ '${{ matrix.os }}' = darwin ]; then
            filename='mcp-connect-darwin-${{ matrix.arch }}-installer.pkg'
          else
            filename='mcp-connect-linux-${{ matrix.arch }}.deb'
          fi
          previous="$RUNNER_TEMP/$filename"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            "https://github.com/SeredaLabs/mcp-connect/releases/download/v0.4.13/$filename" --output "$previous"
          if [ '${{ matrix.os }}' = darwin ]; then
            echo '${{ matrix.previous-sha256 }}'"  $previous" | shasum -a 256 -c -
            sudo installer -pkg "$previous" -target /
            test "$(/Applications/'MCP Connect.app'/Contents/MacOS/mcp-connect version)" = '0.4.13'
          else
            echo '${{ matrix.previous-sha256 }}'"  $previous" | sha256sum -c -
            sudo apt-get install -y "$previous"
            test "$(mcp-connect version)" = '0.4.13'
          fi
      - name: Prepare existing installation for upgrade (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $filename = 'mcp-connect-windows-${{ matrix.arch }}-setup.exe'
          $previous = Join-Path $env:RUNNER_TEMP $filename
          Invoke-WebRequest "https://github.com/SeredaLabs/mcp-connect/releases/download/v0.4.13/$filename" -OutFile $previous
          if ((Get-FileHash $previous -Algorithm SHA256).Hash.ToLowerInvariant() -ne '${{ matrix.previous-sha256 }}') { throw 'Previous installer hash mismatch' }
          $process = Start-Process $previous -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Previous installation failed' }
          $binary = Join-Path $env:LOCALAPPDATA 'Programs\MCP Connect\mcp-connect.exe'
          if ((& $binary version) -ne '0.4.13') { throw 'Previous installed version mismatch' }
      - name: Check installed macOS package
        if: matrix.os == 'darwin'
        shell: bash
        run: |
          sudo installer -pkg "dist/mcp-connect-darwin-${{ matrix.arch }}-installer.pkg" -target /
          codesign --verify --deep --strict '/Applications/MCP Connect.app'
          test "$(/Applications/'MCP Connect.app'/Contents/MacOS/mcp-connect version)" = "$(sed -n 's/^const Version = "\([0-9.]*\)"/\1/p' internal/core/store.go)"
      - name: Check installed Linux package
        if: matrix.os == 'linux'
        shell: bash
        run: |
          sudo apt-get install -y "./dist/mcp-connect-linux-${{ matrix.arch }}.deb"
          test "$(mcp-connect version)" = "$(sed -n 's/^const Version = "\([0-9.]*\)"/\1/p' internal/core/store.go)"
          test -f /usr/share/applications/mcp-connect.desktop
          test -f /usr/share/icons/hicolor/512x512/apps/mcp-connect.png
          sudo apt-get remove -y mcp-connect
          test ! -e /opt/mcp-connect/mcp-connect
      - name: Check Windows installation and removal
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $installer = Resolve-Path "dist/mcp-connect-windows-${{ matrix.arch }}-setup.exe"
          $process = Start-Process $installer -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installation failed: $($process.ExitCode)" }
          $folder = Join-Path $env:LOCALAPPDATA 'Programs\MCP Connect'
          $binary = Join-Path $folder 'mcp-connect.exe'
          $version = (Select-String '^const Version = "([0-9.]+)"' internal/core/store.go).Matches.Groups[1].Value
          if ((& $binary version) -ne $version) { throw 'Installed version mismatch' }
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'MCP Connect.lnk'
          if (-not (Test-Path $shortcut)) { throw 'Start menu shortcut missing' }
          $process = Start-Process (Join-Path $folder 'unins000.exe') -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Removal failed: $($process.ExitCode)" }
          if ((Test-Path $binary) -or (Test-Path $shortcut)) { throw 'Installed files remain after removal' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-connect-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.pkg
            dist/*-setup.exe
            dist/*.deb
          if-no-files-found: error
          retention-days: 1
